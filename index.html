<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acionamento · Celular e computador</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#141414;--placa:#1c1c1c;--borda:#333;--faixa:#16233f;
  --ambar:#e0aa4a;--creme:#fbeed3;--creme-borda:#e6cf9b;--creme-texto:#7a5a17;
  --texto:#ececec;--apagado:#9a9a9a;--ok:#5ec98a;--recusa:#a02a2a;
}
*{box-sizing:border-box}
body{margin:0;background:#080808;color:var(--texto);font-family:Inter,system-ui,sans-serif;padding:28px 20px 70px}
.palco{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:1fr 400px;gap:34px;align-items:start}
@media(max-width:1180px){.palco{grid-template-columns:1fr}}

.legenda{margin:0 0 12px;font-size:12.5px;color:var(--apagado);text-transform:uppercase;letter-spacing:.12em}

/* molduras */
.tela-pc{border:1px solid #2a2a2a;border-radius:12px;overflow:hidden;background:#101010}
.barra-pc{display:flex;align-items:center;gap:7px;padding:9px 13px;background:#1a1a1a;border-bottom:1px solid #2a2a2a}
.bolinha{width:10px;height:10px;border-radius:50%;background:#3a3a3a}
.url{margin-left:10px;font:500 11.5px "Roboto Mono",monospace;color:#6e6e6e}
.tela-pc .conteudo{padding:22px}

.tela-cel{width:378px;max-width:100%;border:9px solid #232323;border-radius:34px;overflow:hidden;background:#101010;margin:0 auto}
.entalhe{height:26px;background:#232323;position:relative}
.entalhe::after{content:"";position:absolute;left:50%;top:2px;transform:translateX(-50%);width:96px;height:18px;border-radius:0 0 12px 12px;background:#141414}
.tela-cel .conteudo{padding:12px;max-height:760px;overflow:auto}

/* card */
.card{background:var(--fundo);border:1px solid var(--borda);border-radius:16px;overflow:hidden}
.topo{background:var(--faixa);display:flex;align-items:center;gap:12px;padding:14px 16px}
.icone{width:36px;height:36px;border-radius:9px;background:#0f1b31;border:1px solid #2b3f66;display:grid;place-items:center;color:var(--creme);flex:none}
.topo h1{margin:0;font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.topo p{margin:3px 0 0;font:500 11.5px "Roboto Mono",monospace;color:#9db0d1}
.tag{margin-left:auto;background:var(--ambar);color:#2a1e05;font-size:11px;font-weight:600;padding:5px 11px;border-radius:999px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}

.aviso{margin:16px;background:var(--creme);border:1px solid var(--creme-borda);border-radius:12px;padding:16px;color:var(--creme-texto);display:flex;gap:13px;align-items:center}
.aviso svg{color:#b98a2e;flex:none}
.aviso b{display:block;font-size:13.5px;color:#5f4510;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.aviso span{font-size:12.5px}

.colunas{display:grid;gap:14px;padding:0 16px 16px}
.passo{border:1px solid var(--borda);border-radius:12px;padding:16px}
.passo h2{margin:0;font-size:13.5px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.07em}
.passo h2 svg{color:var(--ambar);flex:none}
.passo .sub,.passo .bloqueio{margin:7px 0 13px;font-size:12.5px}
.passo .sub{color:var(--apagado)}
.passo .bloqueio{color:var(--ambar)}
.passo.pronto{border-color:#40506e}
.passo.feito{border-color:#2f5a3f}

.valores{background:var(--placa);border:1px solid var(--borda);border-radius:10px;padding:2px 15px;margin-bottom:14px}
.ln{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px dashed var(--borda)}
.ln:last-child{border-bottom:0}
.ln .rot{text-transform:uppercase;letter-spacing:.05em;font-size:12.5px;font-weight:500}
.ln small{display:block;color:var(--apagado);font-size:11px;margin-top:3px;text-transform:none;letter-spacing:0;font-weight:400}
.ln b{font:500 14px "Roboto Mono",monospace;white-space:nowrap}
.rota{padding:6px 0 14px;border-bottom:1px dashed var(--borda)}
.ponto{display:flex;gap:11px;align-items:flex-start}
.ponto i{width:9px;height:9px;border-radius:50%;border:2px solid var(--ambar);flex:none;margin-top:3px;background:var(--placa)}
.ponto.fim i{background:var(--ambar)}
.ponto .tit{font-size:12px;font-weight:500;color:#d6d6d6}
.ponto em{display:block;font-style:normal;font-size:11.5px;color:#7e7e7e;margin-top:2px;line-height:1.35}
.entre{display:flex;align-items:center;gap:11px;padding:2px 0;margin-left:4px;border-left:1px dashed #4a4a4a;padding-left:18px;min-height:22px}
.entre b{font:500 11.5px "Roboto Mono",monospace;color:#a9a9a9}
.trecho b{font:500 12px "Roboto Mono",monospace;color:#c9c9c9;white-space:nowrap}
.ln.grande{padding:15px 0;border-top:1px solid var(--borda)}
.ln.grande .rot{font-family:"Barlow Condensed",sans-serif;font-size:18px}
.ln.grande b{font:700 22px "Roboto Mono",monospace;color:var(--ambar)}

button.acao{width:100%;padding:12px;border:0;border-radius:9px;font:600 13px Inter,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-transform:uppercase;letter-spacing:.06em}
.principal{background:#1e2c4a;color:#fff}
.principal:hover{background:#27385d}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.aceitar{background:#e6e6e6;color:#1a1a1a}
.aceitar:hover{background:#fff}
.recusar{background:var(--recusa);color:#fff}
.recusar:hover{background:#bb3232}
button[disabled]{background:#b9b9b9;color:#5a5a5a;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--ambar);outline-offset:2px}
.oculto{display:none}
.confirmado{margin:0;font-size:12.5px;color:var(--ok)}

/* só no desktop: duas colunas e banner em faixa */
.pc .colunas{grid-template-columns:1.35fr 1fr;align-items:start;padding:0 22px 22px;gap:18px}
.pc .aviso{margin:20px 22px}
.pc .direita{display:grid;gap:16px;align-content:start}

/* ===== ACRÉSCIMO: controle de tempo + SLA (não altera o que já existe) ===== */
:root{--sla-alerta:#f2c94c;--sla-alerta-bg:#3a2f0c;--sla-excedido:#ff5a5a;--sla-excedido-bg:#3a1414;}
.sla{background:var(--placa);border:1px solid var(--borda);border-radius:10px;padding:11px 13px;margin-bottom:14px}
.sla-linhas{display:grid;gap:5px;margin-bottom:9px}
.sla-linha{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12px}
.sla-linha span{color:var(--apagado);text-transform:uppercase;letter-spacing:.05em;font-size:11px}
.sla-linha b{font:500 12.5px "Roboto Mono",monospace;color:#d6d6d6}
.sla-timer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:9px;border-top:1px dashed var(--borda)}
.sla-rot{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--apagado)}
.sla-cron{font:700 20px "Roboto Mono",monospace;color:var(--ok);margin-left:auto;transition:color .2s}
.sla-estado{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:4px 9px;border-radius:999px;background:#12261a;color:var(--ok);border:1px solid #23503a;white-space:nowrap}
/* estados do SLA */
.estado-ok{color:var(--ok)!important}
.sla-estado.estado-ok{background:#12261a;color:var(--ok);border-color:#23503a}
.estado-alerta{color:var(--sla-alerta)!important}
.sla-estado.estado-alerta{background:var(--sla-alerta-bg);color:var(--sla-alerta);border-color:#6b551a}
.estado-excedido{color:var(--sla-excedido)!important}
.sla-estado.estado-excedido{background:var(--sla-excedido-bg);color:var(--sla-excedido);border-color:#6b2222}

/* recusa — motivos */
.recusa-box{margin-top:12px;border:1px solid var(--recusa);border-radius:10px;padding:13px;background:#20100f}
.recusa-box .recusa-tit{margin:0 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#f0b4b4}
.motivos{display:grid;gap:7px;margin-bottom:10px}
.motivos label{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#e6e6e6;cursor:pointer}
.motivos input{accent-color:var(--ambar)}
.recusaObs{width:100%;min-height:58px;resize:vertical;background:#151515;border:1px solid var(--borda);border-radius:8px;color:var(--texto);font:400 12.5px Inter,sans-serif;padding:8px;margin-bottom:10px}

/* status de sincronização */
.sync{margin:11px 0 0;font-size:12px;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:.03em}
.sync.processando{color:var(--ambar)}
.sync.aguardando{color:var(--sla-alerta)}
.sync.erro{color:var(--sla-excedido)}
.sync.okmsg{color:var(--ok)}
.sync .ponto-anim{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pisca 1s ease-in-out infinite}
@keyframes pisca{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.ponto-anim{animation:none}}
.btnTentar{margin-top:8px}
</style>
</head>
<body>

<template id="modelo">
  <div class="card">
    <div class="topo">
      <div class="icone"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></div>
      <div>
        <h1>Novo acionamento</h1>
        <p class="ref">ATD20260909/7262 · Guincho 04</p>
      </div>
      <span class="tag">Enviado</span>
    </div>

    <div class="aviso">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6z"/></svg>
      <div>
        <b>Complete os dois passos para acessar o atendimento</b>
        <span>Confirme o valor com o aceite e envie ao motorista.</span>
      </div>
    </div>

    <div class="colunas">
      <section class="passo pronto p1">
        <h2><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg> 1. Confirmação de valor e aceite</h2>
        <p class="sub">Obrigatório: confira o valor do serviço e aceite o acionamento.</p>

        <!-- SLA 1 · CENTRAL → ACEITE DO PRESTADOR (horário oficial do servidor) -->
        <div class="sla sla1">
          <div class="sla-linhas">
            <div class="sla-linha"><span>Acionamento enviado</span><b class="slaEnviado">—</b></div>
            <div class="sla-linha"><span>Visualizado</span><b class="slaVisto">—</b></div>
          </div>
          <div class="sla-timer">
            <span class="sla-rot">Tempo para aceite</span>
            <b class="sla-cron slaCron1">00:00</b>
            <span class="sla-estado slaEstado1">Dentro do SLA</span>
          </div>
        </div>

        <div class="valores">
          <div class="ln"><div class="rot">KM total do serviço<small class="detRota">—</small></div><b class="kmTotal">—</b></div>
          <div class="rota">
            <div class="ponto"><i></i><div><span class="tit">Base · saída</span><em class="endBase1"></em></div></div>
            <div class="entre"><b class="km1">—</b></div>
            <div class="ponto"><i></i><div><span class="tit">Origem · retirada</span><em class="endOrigem"></em></div></div>
            <div class="entre"><b class="km2">—</b></div>
            <div class="ponto"><i></i><div><span class="tit">Destino · entrega</span><em class="endDestino"></em></div></div>
            <div class="entre"><b class="km3">—</b></div>
            <div class="ponto fim"><i></i><div><span class="tit">Base · retorno</span><em class="endBase2"></em></div></div>
          </div>
          <div class="ln"><div class="rot">KM contratual incluso<small class="detFranquia">—</small></div><b class="kmContrato">—</b></div>
          <div class="ln"><div class="rot">KM excedente</div><b class="kmExc">—</b></div>
          <div class="ln"><div class="rot">Valor de saída</div><b class="saida">—</b></div>
          <div class="ln"><div class="rot">Valor excedente<small class="detExc">—</small></div><b class="valExc">—</b></div>
          <div class="ln grande"><div class="rot">Valor do atendimento</div><b class="total">—</b></div>
        </div>
        <div class="dupla">
          <button class="acao principal btnConfirmar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg> Confirmar e aceitar
          </button>
          <button class="acao recusar btnRecusar">Recusar</button>
        </div>

        <!-- status de sincronização com o servidor -->
        <p class="sync oculto syncMsg"><span class="ponto-anim"></span><span class="syncTxt"></span></p>
        <button class="acao principal btnTentar oculto">Tentar novamente</button>

        <!-- motivos da recusa -->
        <div class="recusa-box oculto recusaBox">
          <p class="recusa-tit">Motivo da recusa</p>
          <div class="motivos">
            <label><input type="radio" name="motivo" value="Valor"> Valor</label>
            <label><input type="radio" name="motivo" value="Distância"> Distância</label>
            <label><input type="radio" name="motivo" value="Sem veículo disponível"> Sem veículo disponível</label>
            <label><input type="radio" name="motivo" value="Motorista indisponível"> Motorista indisponível</label>
            <label><input type="radio" name="motivo" value="Fora da área"> Fora da área</label>
            <label><input type="radio" name="motivo" value="Problema mecânico"> Problema mecânico</label>
            <label><input type="radio" name="motivo" value="Outro"> Outro</label>
          </div>
          <textarea class="recusaObs oculto" placeholder="Descreva o motivo da recusa"></textarea>
          <div class="dupla">
            <button class="acao recusar btnConfirmarRecusa">Confirmar recusa</button>
            <button class="acao principal btnCancelarRecusa">Voltar</button>
          </div>
        </div>

        <p class="confirmado oculto okValor">✓ Valor confirmado e acionamento aceito.</p>
      </section>

      <div class="direita">
        <section class="passo p3">
          <h2><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="14" height="10" rx="1"/><path d="M15 9h4l3 3v4h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg> 2. Enviar para motorista</h2>
          <p class="bloqueio msg3">⚠ Confirme e aceite o acionamento para enviar.</p>

          <!-- SLA 2 · PRESTADOR → ENVIO AO MOTORISTA -->
          <div class="sla sla2 oculto">
            <div class="sla-timer">
              <span class="sla-rot">Tempo para enviar ao motorista</span>
              <b class="sla-cron slaCron2">00:00</b>
              <span class="sla-estado slaEstado2">Dentro do SLA</span>
            </div>
          </div>

          <p class="sync oculto syncEnvio"><span class="ponto-anim"></span><span class="syncEnvioTxt"></span></p>
          <button class="acao btnEnviar" disabled>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg> Enviar para motorista
          </button>
        </section>
      </div>
    </div>
  </div>
</template>

<div class="palco">
  <div>
    <p class="legenda">Computador</p>
    <div class="tela-pc pc">
      <div class="barra-pc">
        <i class="bolinha"></i><i class="bolinha"></i><i class="bolinha"></i>
        <span class="url">painel.suaempresa.com.br/prestador/acionamentos</span>
      </div>
      <div class="conteudo" id="alvoPc"></div>
    </div>
  </div>

  <div>
    <p class="legenda">Celular</p>
    <div class="tela-cel">
      <div class="entalhe"></div>
      <div class="conteudo" id="alvoCel"></div>
    </div>
  </div>
</div>

<script src="sla-core.js"></script>
<script>
const brl = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num = v => v.toLocaleString('pt-BR',{maximumFractionDigits:1});

/* Identificação/segurança do acionamento (vem da URL; token/validade são
   validados no backend). Sem parâmetros, usa o acionamento de demonstração. */
const P = SLA.lerParamsURL();
const CTX = {
  atendimento_id: P.atendimento_id || 'ATD20260909/7262',
  prestador_id:   P.prestador_id   || 'GUINCHO-04',
  motorista_id:   P.motorista_id   || 'MOT-01',
  protocolo:      P.atendimento_id || 'ATD20260909/7262'
};

/* Troque pelo fetch da sua API / Supabase */
async function carregarAcionamento(){
  await new Promise(r => setTimeout(r,300));
  return {
    base:   { nome:'Av. Bezerra de Menezes, 1820 · Fortaleza',        km:0 },
    origem: { nome:'Rua Padre Guerra, 470 · Parquelândia, Fortaleza', km:6.8 },   // base → origem
    destino:{ nome:'Av. Parque Oeste, 1155 · Pajuçara, Maracanaú',    km:24.9 },  // origem → destino
    retorno:{ km:22.3 },                                                          // destino → base
    kmContratual:40, valorSaida:180, valorKm:4.47
  };
}

function montar(alvo){
  const no = document.getElementById('modelo').content.cloneNode(true);
  alvo.appendChild(no);
  const raiz = alvo.firstElementChild;
  const q = c => raiz.querySelector('.'+c);

  /* estado desta instância (cada tela = um dispositivo) */
  const st = { dados:null, linha:null, cfg:null, aceito:false, enviado:false,
               ocupado:false, cron1:null, cron2:null, aceite_em:null };

  /* ---- cálculo original preservado integralmente ---- */
  carregarAcionamento().then(d=>{
    const kmTotal = d.origem.km + d.destino.km + d.retorno.km;
    const exc = Math.max(0, kmTotal - d.kmContratual);
    const valExc = exc * d.valorKm;
    d.kmTotal = kmTotal;

    q('detRota').textContent = 'rota estimada em 4 pontos';
    q('endBase1').textContent = d.base.nome;
    q('endBase2').textContent = d.base.nome;
    q('endOrigem').textContent = d.origem.nome;
    q('endDestino').textContent = d.destino.nome;
    q('km1').textContent = num(d.origem.km)+' km';
    q('km2').textContent = num(d.destino.km)+' km';
    q('km3').textContent = num(d.retorno.km)+' km';
    q('kmTotal').textContent = num(d.kmTotal)+' km';
    q('kmContrato').textContent = num(d.kmContratual)+' km';
    q('detFranquia').textContent = 'km total contratual';
    q('kmExc').textContent = num(exc)+' km';
    q('saida').textContent = brl(d.valorSaida);
    q('valExc').textContent = brl(valExc);
    q('detExc').textContent = `${num(exc)} km × ${brl(d.valorKm)}`;
    q('total').textContent = brl(d.valorSaida + valExc);

    /* valores apresentados (usados no evento de aceite enviado ao backend) */
    d.valorTotal = d.valorSaida + valExc;
    st.dados = d;
  });

  /* ================= controle de tempo + SLA 1 (central → aceite) =========== */
  (async function iniciarSLA(){
    const acesso = await SLA.validarAcesso({
      atendimento_id: CTX.atendimento_id, prestador_id: CTX.prestador_id,
      token: P.token, validade: P.validade
    });
    if(!acesso.ok){
      q('sub') && (q('sub').textContent = 'Acesso não autorizado a este acionamento.');
      raiz.querySelector('.dupla').classList.add('oculto');
      return;
    }

    st.cfg = await SLA.carregarConfig(CTX.atendimento_id);
    st.linha = await SLA.carregarLinhaTempo(CTX.atendimento_id);

    q('slaEnviado').textContent = 'às ' + SLA.hhmm(st.linha.enviado_em);

    /* registra a VISUALIZAÇÃO no servidor assim que o prestador abre o link */
    SLA.registrarEvento({
      atendimento_id: CTX.atendimento_id, prestador_id: CTX.prestador_id,
      evento:'ACIONAMENTO_VISUALIZADO', status:'VISUALIZADO'
    }).then(r=>{ q('slaVisto').textContent = 'às ' + SLA.hhmm(r.servidor_hora); })
      .catch(()=>{ q('slaVisto').textContent = 'às ' + SLA.hhmm(SLA.agoraServidor()); });

    if(st.linha.visualizado_em) q('slaVisto').textContent = 'às ' + SLA.hhmm(st.linha.visualizado_em);

    /* cronômetro visual do SLA de aceite (cálculo oficial usa o servidor) */
    st.cron1 = new SLA.Cronometro({
      inicioServidor: st.linha.enviado_em,
      limiteSeg: st.cfg.sla.aceite_prestador_seg,
      elTempo: q('slaCron1'), elEstado: q('slaEstado1')
    }).iniciar();
  })();

  /* --------- helpers de status de sincronização (passo 1) ---------- */
  const elSync = q('syncMsg'), elSyncTxt = q('syncTxt');
  function status(tipo, txt){
    elSync.className = 'sync syncMsg ' + tipo;   // mantém o marcador .syncMsg
    elSyncTxt.textContent = txt;
  }
  function limparStatus(){ elSync.className = 'sync syncMsg oculto'; }

  /* ======================= ACEITE (registra no backend) ==================== */
  q('btnConfirmar').addEventListener('click', async ()=>{
    if(!st.cfg || !st.linha){ status('processando','Carregando acionamento…'); return; }
    if(st.ocupado || st.aceito) return;           // impede aceite duplicado
    st.ocupado = true;
    const btn = q('btnConfirmar');
    const rotuloOrig = btn.innerHTML;
    btn.disabled = true; q('btnRecusar').disabled = true;
    btn.textContent = 'Processando...';
    q('btnTentar').classList.add('oculto');
    status('processando', 'PROCESSANDO...');

    const limite = st.cfg.sla.aceite_prestador_seg;
    const desdeEnvio = Math.round((SLA.agoraServidor() - st.linha.enviado_em)/1000);
    const desdeVisto = st.linha.visualizado_em
      ? Math.round((SLA.agoraServidor() - st.linha.visualizado_em)/1000) : null;

    try{
      const r = await SLA.registrarEvento({
        atendimento_id: CTX.atendimento_id, prestador_id: CTX.prestador_id,
        evento:'PRESTADOR_ACEITOU', status:'ACEITO',
        dados_adicionais:{
          protocolo: CTX.protocolo,
          km_total_apresentado: st.dados ? st.dados.kmTotal : null,
          valor_apresentado: st.dados ? st.dados.valorTotal : null,
          valor_aceito: st.dados ? st.dados.valorTotal : null,
          tempo_desde_envio_seg: desdeEnvio,
          tempo_desde_visualizacao_seg: desdeVisto,
          sla_limite_seg: limite,
          resultado_sla: SLA.resultadoSLA(SLA.agoraServidor()-st.linha.enviado_em, limite)
        }
      }, { onPendente: ()=> status('aguardando','AGUARDANDO SINCRONIZAÇÃO…') });

      /* SOMENTE após confirmação do servidor a tela vira "ACEITO" */
      st.aceito = true; st.ocupado = false;
      st.aceite_em = r.servidor_hora;
      if(st.cron1) st.cron1.parar();
      limparStatus();
      aplicarAceite();
    }catch(e){
      /* falha de comunicação: NÃO assume aceito; permite nova tentativa segura */
      st.ocupado = false;
      btn.disabled = false; q('btnRecusar').disabled = false;
      btn.innerHTML = rotuloOrig;
      status('erro', 'Erro de sincronização. O aceite não foi confirmado.');
      q('btnTentar').classList.remove('oculto');
    }
  });

  q('btnTentar').addEventListener('click', ()=> q('btnConfirmar').click());

  /* aplica os efeitos visuais originais do aceite + libera o passo 2 (SLA 2) */
  function aplicarAceite(){
    q('btnConfirmar').classList.add('oculto');
    q('btnRecusar').classList.add('oculto');
    q('recusaBox').classList.add('oculto');
    q('okValor').classList.remove('oculto');
    q('p1').classList.add('feito');
    q('btnEnviar').disabled = false;
    q('btnEnviar').classList.add('aceitar');
    q('p3').classList.add('pronto');
    q('msg3').textContent = 'Escolha o motorista e envie a ordem.';
    q('msg3').style.color = 'var(--apagado)';
    q('tag').textContent = 'Aceito';

    /* SLA 2 · prestador → envio ao motorista, a partir do aceite */
    q('sla2').classList.remove('oculto');
    st.cron2 = new SLA.Cronometro({
      inicioServidor: st.aceite_em,
      limiteSeg: st.cfg.sla.envio_motorista_seg,
      elTempo: q('slaCron2'), elEstado: q('slaEstado2')
    }).iniciar();
  }

  /* ============================ RECUSA ==================================== */
  q('btnRecusar').addEventListener('click', ()=>{
    if(st.aceito || st.ocupado) return;
    q('recusaBox').classList.remove('oculto');
  });
  q('btnCancelarRecusa').addEventListener('click', ()=> q('recusaBox').classList.add('oculto'));
  raiz.querySelectorAll('input[name="motivo"]').forEach(r=>{
    r.addEventListener('change', ()=>{
      q('recusaObs').classList.toggle('oculto', r.value !== 'Outro' || !r.checked);
    });
  });

  q('btnConfirmarRecusa').addEventListener('click', async ()=>{
    if(!st.cfg || !st.linha){ status('processando','Carregando acionamento…'); return; }
    if(st.ocupado || st.aceito) return;
    const sel = raiz.querySelector('input[name="motivo"]:checked');
    if(!sel){ status('erro','Selecione um motivo para recusar.'); return; }
    const obs = q('recusaObs').value.trim();
    st.ocupado = true;
    q('btnConfirmarRecusa').disabled = true; q('btnCancelarRecusa').disabled = true;
    status('processando','PROCESSANDO...');

    const decorrido = Math.round((SLA.agoraServidor() - st.linha.enviado_em)/1000);
    try{
      await SLA.registrarEvento({
        atendimento_id: CTX.atendimento_id, prestador_id: CTX.prestador_id,
        evento:'PRESTADOR_RECUSOU', status:'RECUSADO',
        dados_adicionais:{
          protocolo: CTX.protocolo, motivo: sel.value,
          observacao: sel.value==='Outro' ? obs : null,
          tempo_ate_recusa_seg: decorrido
        }
      }, { onPendente: ()=> status('aguardando','AGUARDANDO SINCRONIZAÇÃO…') });

      st.ocupado = true; // permanece bloqueado após recusar
      if(st.cron1) st.cron1.parar();
      limparStatus();
      q('recusaBox').classList.add('oculto');
      const t = q('tag');
      t.textContent='Recusado'; t.style.background='var(--recusa)'; t.style.color='#fff';
      q('btnConfirmar').disabled=true; q('btnRecusar').disabled=true;
      q('msg3').textContent='Acionamento recusado. A central foi avisada.';
      q('msg3').style.color='var(--apagado)';
    }catch(e){
      st.ocupado = false;
      q('btnConfirmarRecusa').disabled = false; q('btnCancelarRecusa').disabled = false;
      status('erro','Erro de sincronização. A recusa não foi confirmada.');
    }
  });

  /* ==================== ENVIAR PARA MOTORISTA (SLA 2) ===================== */
  const elSyncEnvio = q('syncEnvio'), elSyncEnvioTxt = q('syncEnvioTxt');
  function statusEnvio(tipo, txt){
    elSyncEnvio.className = 'sync syncEnvio ' + tipo;  // mantém o marcador .syncEnvio
    elSyncEnvioTxt.textContent = txt;
  }

  q('btnEnviar').addEventListener('click', async ()=>{
    if(!st.aceito || st.enviado || st.ocupado) return;
    st.ocupado = true;
    q('btnEnviar').disabled = true;
    statusEnvio('processando','PROCESSANDO...');

    const limite = st.cfg.sla.envio_motorista_seg;
    const entreAceiteEnvio = Math.round((SLA.agoraServidor() - st.aceite_em)/1000);
    try{
      await SLA.registrarEvento({
        atendimento_id: CTX.atendimento_id, prestador_id: CTX.prestador_id,
        motorista_id: CTX.motorista_id,
        evento:'ENVIADO_MOTORISTA', status:'ENVIADO_MOTORISTA',
        dados_adicionais:{
          protocolo: CTX.protocolo,
          tempo_entre_aceite_envio_seg: entreAceiteEnvio,
          sla_limite_seg: limite,
          resultado_sla: SLA.resultadoSLA(SLA.agoraServidor()-st.aceite_em, limite)
        }
      }, { onPendente: ()=> statusEnvio('aguardando','AGUARDANDO SINCRONIZAÇÃO…') });

      st.enviado = true; st.ocupado = false;
      if(st.cron2) st.cron2.parar();
      elSyncEnvio.className = 'sync syncEnvio oculto';
      q('p3').classList.add('feito');
      q('msg3').textContent='Enviado ao motorista. Aguardando início do atendimento.';
      q('msg3').style.color='var(--ok)';
      q('btnEnviar').disabled=true; q('tag').textContent='Em rota';
    }catch(e){
      st.ocupado = false; q('btnEnviar').disabled = false;
      statusEnvio('erro','Erro de sincronização. Reenvie ao motorista.');
    }
  });
}

montar(document.getElementById('alvoPc'));
montar(document.getElementById('alvoCel'));
</script>
