<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sgroup Proteção Veicular — atendimento</title>
<style>
  :root{
    --topo:#075e54;
    --acao:#25d366;
    --fundo:#e5ddd5;
    --bot:#ffffff;
    --meu:#dcf8c6;
    --texto:#111b21;
    --suave:#667781;
    --link:#027eb5;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#1f2c33;color:var(--texto);
    font-family:"Segoe UI",ui-sans-serif,system-ui,"Helvetica Neue",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  /* aparelho */
  .tela{
    width:390px;height:min(844px, calc(100dvh - 40px));
    display:flex;flex-direction:column;background:var(--fundo);
    border-radius:38px;overflow:hidden;position:relative;
    border:10px solid #0d1418;box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .entalhe{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:130px;height:24px;background:#0d1418;border-radius:0 0 16px 16px;z-index:4;
  }
  .statusbar{
    background:var(--topo);color:#fff;display:flex;justify-content:space-between;
    padding:7px 22px 2px;font-size:12px;font-weight:600;flex:none;
  }
  /* celular de verdade: ocupa a tela inteira */
  @media (max-width:520px){
    body{padding:0;background:var(--fundo)}
    .tela{width:100%;height:100dvh;border:none;border-radius:0;box-shadow:none}
    .entalhe{display:none}
  }

  .topo{
    background:var(--topo);color:#fff;display:flex;align-items:center;gap:12px;
    padding:10px 14px;flex:none;
  }
  .avatar{
    width:42px;height:42px;border-radius:50%;flex:none;object-fit:cover;
    background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.35);
  }
  .topo h1{font-size:15.5px;margin:0;font-weight:600}
  .topo small{font-size:12px;opacity:.8}
  .topo .estado{margin-left:auto;font-size:11px;display:flex;align-items:center;gap:6px;opacity:.9;cursor:pointer}
  .topo .estado input{accent-color:#fff}

  .conversa{
    flex:1;overflow-y:auto;padding:16px 14px 22px;display:flex;flex-direction:column;gap:8px;
    background-color:var(--fundo);
    background-image:radial-gradient(circle at 20% 30%, rgba(255,255,255,.35) 0 2px, transparent 3px),
                     radial-gradient(circle at 70% 60%, rgba(255,255,255,.3) 0 2px, transparent 3px);
    background-size:70px 70px;
  }
  .dia{align-self:center;background:#e1f2fb;color:var(--suave);font-size:12px;padding:5px 12px;border-radius:8px;margin-bottom:4px}

  .msg{
    max-width:80%;padding:7px 10px 6px;font-size:14.5px;line-height:1.42;position:relative;
    border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13);white-space:pre-wrap;word-wrap:break-word;
  }
  .msg .hora{font-size:11px;color:var(--suave);float:right;margin:6px 0 -2px 10px}
  .deles{background:var(--bot);align-self:flex-start;border-top-left-radius:0}
  .minha{background:var(--meu);align-self:flex-end;border-top-right-radius:0}
  .minha .hora::after{content:" ✓✓";color:#53bdeb}

  .cartao{
    max-width:80%;align-self:flex-start;background:var(--bot);border-radius:8px;border-top-left-radius:0;
    box-shadow:0 1px .5px rgba(11,20,26,.13);overflow:hidden;
  }
  .cartao p{margin:0;padding:8px 10px 4px;font-size:14.5px;line-height:1.42}
  .cartao .hora{display:block;text-align:right;font-size:11px;color:var(--suave);padding:0 10px 6px}
  .cartao button{
    width:100%;border:none;border-top:1px solid #e9edef;background:var(--bot);color:var(--link);
    padding:11px;font-size:14.5px;font-family:inherit;cursor:pointer;font-weight:500;
  }
  .cartao button:hover{background:#f5f6f6}
  .cartao button[disabled]{color:var(--suave);cursor:default;background:#f7f8f8}

  .digitando{background:var(--bot);align-self:flex-start;border-radius:8px;border-top-left-radius:0;padding:12px 14px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
  .digitando span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:#9aa3a8;animation:p 1s infinite}
  .digitando span:nth-child(2){animation-delay:.15s}
  .digitando span:nth-child(3){animation-delay:.3s}
  @keyframes p{0%,60%,100%{opacity:.3}30%{opacity:1}}

  .rapidas{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 6px;justify-content:flex-end}
  .rapidas button{
    background:#fff;color:var(--link);border:1px solid #cfd6d8;border-radius:16px;
    padding:7px 14px;font-size:14px;font-family:inherit;cursor:pointer;
  }

  .barra{display:flex;gap:8px;align-items:center;padding:8px 10px;background:#f0f2f5;flex:none}
  .barra input{
    flex:1;border:none;border-radius:20px;padding:11px 16px;font-size:15px;font-family:inherit;
    background:#fff;color:var(--texto);
  }
  .barra input:focus,button:focus-visible{outline:2px solid var(--topo);outline-offset:1px}
  .barra .enviar{
    width:44px;height:44px;border:none;border-radius:50%;background:var(--acao);color:#fff;
    font-size:17px;cursor:pointer;flex:none;display:grid;place-items:center;
  }
  .barra .enviar[disabled]{opacity:.45;cursor:not-allowed}
  .recomeca{background:none;border:none;color:var(--suave);font-size:20px;cursor:pointer;padding:6px}

  .fundo{position:fixed;inset:0;background:rgba(11,20,26,.5);display:none;z-index:5}
  .fundo.on{display:block}
  .folha{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(340px,calc(100% - 28px));max-height:78vh;background:#fff;border-radius:14px;
    display:none;flex-direction:column;overflow:hidden;z-index:6;
  }
  .folha.on{display:flex}
  .folha .cabeca{display:flex;align-items:center;gap:16px;padding:16px 18px}
  .folha h2{font-size:17px;margin:0;font-weight:500}
  .fechar{background:none;border:none;font-size:22px;line-height:1;padding:2px 6px;cursor:pointer;color:var(--texto)}
  .lista{overflow-y:auto;padding-bottom:10px}
  .item{
    width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;background:none;
    border:none;text-align:left;padding:17px 20px;font-size:15px;font-family:inherit;color:var(--texto);cursor:pointer;
  }
  .item:hover{background:#f5f6f6}
  .item .radio{width:17px;height:17px;border:1px solid #9aa3a8;border-radius:50%;flex:none}
  @media (prefers-reduced-motion:reduce){.digitando span{animation:none;opacity:.5}}
</style>
</head>

    <div>
      <h1>Sgroup Proteção Veicular</h1>
      <small id="statusTopo">online</small>
    </div>
    <label class="estado"><input type="checkbox" id="atendentes"> atendentes livres</label>
  </div>

  <div class="conversa" id="conversa" aria-live="polite"></div>
  <div class="rapidas" id="rapidas"></div>

  <div class="barra">
    <button class="recomeca" id="reiniciar" title="Reiniciar conversa" aria-label="Reiniciar conversa">⟳</button>
    <input id="entrada" placeholder="Mensagem" autocomplete="off" aria-label="Mensagem">
    <button class="enviar" id="enviar" aria-label="Enviar">➤</button>
  </div>
</div>

<div class="fundo" id="fundo"></div>
<div class="folha" id="folha" role="dialog" aria-modal="true" aria-label="Selecione uma opção">
  <div class="cabeca">
    <button class="fechar" id="fecharFolha" aria-label="Fechar">&times;</button>
    <h2>Selecione uma opção</h2>
  </div>
  <div class="lista" id="lista"></div>
</div>

<script>
const conversa = document.getElementById('conversa');
const rapidas  = document.getElementById('rapidas');
const entrada  = document.getElementById('entrada');
const enviar   = document.getElementById('enviar');
const fundo    = document.getElementById('fundo');
const folha    = document.getElementById('folha');
const lista    = document.getElementById('lista');

const MENU = [
  'Informar roubo/furto',
  'Assistência 24h',
  'Faça sua cotação',
  'Segunda via de Boletos',
  'Atendimento Ao Associado',
  'Consultar Sinistro',
  'Rastreamento'
];

// Base fictícia. Troque pela consulta real da sua API.
const BASE = {
  '11122233344': 'Marina',
  '98765432100': 'Roberto',
  '12345678000199': 'Transportes Aurora'
};

let estado = 'saudacao';
let tentativas = 0;
let botaoAtual = null;

const hora = () => new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const fim  = () => conversa.scrollTop = conversa.scrollHeight;

// Relógio da barra de status acompanha a hora real do aparelho.
const relogio = document.getElementById('relogio');
const atualizarRelogio = () => relogio.textContent = hora();
atualizarRelogio(); setInterval(atualizarRelogio, 15000);

function msg(texto, quem='deles'){
  const el = document.createElement('div');
  el.className = 'msg ' + quem;
  el.textContent = texto;
  const h = document.createElement('span');
  h.className = 'hora';
  h.textContent = hora();
  el.appendChild(h);
  conversa.appendChild(el);
  fim();
}

function bot(texto, depois){
  const t = document.createElement('div');
  t.className = 'digitando';
  t.innerHTML = '<span></span><span></span><span></span>';
  conversa.appendChild(t); fim();
  setTimeout(() => { t.remove(); msg(texto,'deles'); if (depois) depois(); }, 700);
}

function rapidasBotoes(l){
  rapidas.innerHTML = '';
  l.forEach(([rotulo,valor]) => {
    const b = document.createElement('button');
    b.textContent = rotulo;
    b.onclick = () => { msg(rotulo,'minha'); rapidas.innerHTML=''; processar(valor); acaoCliente(); };
    rapidas.appendChild(b);
  });
}
const limpaRapidas = () => rapidas.innerHTML = '';
const soDigitos = s => s.replace(/\D/g,'');
const formatar = d => d.length === 11
  ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4')
  : d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');

function cartaoMenu(){
  const card = document.createElement('div');
  card.className = 'cartao';
  const p = document.createElement('p');
  p.innerHTML = 'Bem vindo(a) a <strong>Sgroup Proteção Veicular</strong>!<br><br>📌 Como podemos ajudá-lo(a)?';
  const h = document.createElement('span');
  h.className = 'hora'; h.textContent = hora();
  const b = document.createElement('button');
  b.textContent = '☰  Selecione uma opção';
  b.onclick = () => abrirLista(b);
  card.append(p,h,b);
  conversa.appendChild(card); fim();
}

function abrirLista(botao){
  botaoAtual = botao;
  lista.innerHTML = '';
  MENU.forEach(op => {
    const b = document.createElement('button');
    b.className = 'item';
    b.innerHTML = '<span>' + op + '</span><span class="radio"></span>';
    b.onclick = () => { fecharLista(); escolher(op); acaoCliente(); };
    lista.appendChild(b);
  });
  fundo.classList.add('on');
  folha.classList.add('on');
}
function fecharLista(){ fundo.classList.remove('on'); folha.classList.remove('on'); }
document.getElementById('fecharFolha').onclick = fecharLista;
fundo.onclick = fecharLista;
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharLista(); });

function escolher(op){
  if (botaoAtual){ botaoAtual.textContent = '☰  ' + op; botaoAtual.disabled = true; botaoAtual = null; }
  msg(op,'minha');
  if (op === 'Segunda via de Boletos'){
    estado = 'cpf'; tentativas = 0;
    bot('Para emissão de boleto(s), digite o número do seu CPF/CNPJ:');
  } else {
    estado = 'confirmar';
    bot('Certo, vamos tratar de "' + op + '". Deseja falar com um atendente?', () => {
      rapidasBotoes([['Sim','sim'],['Não','nao'],['Voltar ao menu','voltar']]);
    });
  }
}

/* ---- Inatividade: avisos automáticos e encerramento ---- */
// MODO_DEMO = true troca minutos por segundos, para testar sem esperar.
// Em produção deixe false.
const MODO_DEMO = false;
const UNIDADE = MODO_DEMO ? 1000 : 60000; // 1 unidade = 1 s (demo) ou 1 min (produção)

// Cada espera é contada a partir do passo anterior. O relógio reinicia
// sempre que o cliente envia algo (mensagem, opção ou botão).
const ESPERA_1_AVISO  = 5;                      // 5 min sem resposta  -> 1º "ainda está aí?"
const ESPERA_2_AVISO  = 10;                     // +10 min sem resposta -> 2º "ainda está aí?"
const ESPERA_FINAL    = 10;                     // +10 min sem resposta -> mensagem final (atendimento pausado)
// Depois da mensagem final o atendimento fica pausado por 12 h: se o cliente
// voltar nesse período, continua de onde parou; passado isso, começa do zero.
const JANELA_RETOMADA = MODO_DEMO ? 20 : 12*60; // demo: 20 s

const AVISO_AINDA_AI = 'O(a) senhor(a) ainda está aí? Seguimos à disposição para continuar o seu atendimento.';

const ETAPAS_INATIVIDADE = [
  { apos: ESPERA_1_AVISO,                                 fazer: () => bot(AVISO_AINDA_AI) },
  { apos: ESPERA_1_AVISO + ESPERA_2_AVISO,                fazer: () => bot(AVISO_AINDA_AI) },
  { apos: ESPERA_1_AVISO + ESPERA_2_AVISO + ESPERA_FINAL, fazer: () => pausarPorInatividade() }
];

let temporizadores = [];

function limparInatividade(){
  temporizadores.forEach(clearTimeout);
  temporizadores = [];
}

function agendarInatividade(){
  limparInatividade();
  if (estado === 'encerrado' || estado === 'pausado') return;
  ETAPAS_INATIVIDADE.forEach(etapa => {
    const id = setTimeout(() => {
      if (estado === 'encerrado' || estado === 'pausado') return;
      etapa.fazer();
    }, etapa.apos * UNIDADE);
    temporizadores.push(id);
  });
}

// Chame sempre que o cliente interagir (digitar, escolher opção, tocar em botão).
function acaoCliente(){ agendarInatividade(); }

let estadoAnterior = null; // onde a conversa estava quando foi pausada
let pausadoEm = 0;         // quando a mensagem final foi enviada

function pausarPorInatividade(){
  limparInatividade();
  estadoAnterior = estado;
  pausadoEm = Date.now();
  estado = 'pausado';
  limpaRapidas();
  bot('Como não tivemos retorno nos últimos minutos, vamos finalizar este atendimento por enquanto para não deixar sua solicitação aberta desnecessariamente.\n\nMas fique tranquilo(a): caso ainda precise de ajuda, é só nos chamar novamente que daremos continuidade ao seu atendimento. 😊');
}

// Cliente voltou a escrever depois da mensagem final.
function retomar(texto){
  const dentroDaJanela = Date.now() - pausadoEm < JANELA_RETOMADA * UNIDADE;
  const anterior = estadoAnterior;
  estadoAnterior = null; pausadoEm = 0;
  if (dentroDaJanela){
    estado = anterior;
    bot('Que bom que voltou! Vamos dar continuidade ao seu atendimento de onde paramos.', () => processar(texto));
  } else {
    estado = 'saudacao';
    processar(texto);
  }
}

function iniciar(){
  conversa.innerHTML = '';
  limpaRapidas();
  limparInatividade();
  estadoAnterior = null; pausadoEm = 0;
  estado = 'saudacao'; tentativas = 0;
  entrada.disabled = false; enviar.disabled = false;
  const d = document.createElement('div');
  d.className = 'dia'; d.textContent = 'Hoje';
  conversa.appendChild(d);
}

function processar(texto){
  if (estado === 'saudacao'){
    estado = 'menu';
    const t = document.createElement('div');
    t.className = 'digitando';
    t.innerHTML = '<span></span><span></span><span></span>';
    conversa.appendChild(t); fim();
    setTimeout(() => { t.remove(); cartaoMenu(); }, 700);
    return;
  }

  if (estado === 'menu'){
    const achou = MENU.find(o => o.toLowerCase() === texto.toLowerCase());
    if (achou) return escolher(achou);
    bot('Toque em "Selecione uma opção" para escolher um dos serviços.');
    return;
  }

  if (estado === 'cpf'){
    const doc = soDigitos(texto);
    if (doc.length !== 11 && doc.length !== 14){
      bot('Documento inválido. Digite o CPF (11 dígitos) ou o CNPJ (14 dígitos).');
      return;
    }
    if (BASE[doc]){
      estado = 'confirmar';
      bot('Encontrei seu cadastro, ' + BASE[doc] + '. Enviei o boleto em aberto do documento ' + formatar(doc) + ' para o seu e-mail.', () => {
        bot('Precisa de mais alguma coisa?', () => {
          rapidasBotoes([['Falar com atendente','sim'],['Não, obrigado','nao'],['Voltar ao menu','voltar']]);
        });
      });
      return;
    }
    tentativas++;
    if (tentativas === 1){
      bot('Não localizamos seu CPF. Pode informar novamente?');
    } else {
      estado = 'confirmar';
      bot('Não localizamos seu CPF. Deseja falar com um atendente?', () => {
        rapidasBotoes([['Sim','sim'],['Não','nao'],['Voltar ao menu','voltar']]);
      });
    }
    return;
  }

  if (estado === 'confirmar'){
    const r = texto.toLowerCase();
    if (r.startsWith('s')) return transbordo();
    if (r.startsWith('v')) return iniciar();
    if (r.startsWith('n')) return encerrar();
    bot('Não entendi. Responda com sim, não ou voltar.', () => {
      rapidasBotoes([['Sim','sim'],['Não','nao'],['Voltar ao menu','voltar']]);
    });
    return;
  }

  if (estado === 'pausado') return retomar(texto);

  if (estado === 'encerrado'){
    estado = 'saudacao';
    processar(texto);
  }
}

function transbordo(){
  estado = 'encerrado';
  limparInatividade();
  if (document.getElementById('atendentes').checked){
    bot('Estou te transferindo para um atendente. Um momento, por favor.', limpaRapidas);
  } else {
    bot('No momento nossos atendentes estão ocupados. Escreva sua mensagem aqui e retornaremos em breve.', limpaRapidas);
  }
}
function encerrar(){
  estado = 'encerrado';
  limparInatividade();
  bot('Agradecemos o contato. Estamos à disposição sempre que precisar.', limpaRapidas);
}

enviar.onclick = () => {
  const v = entrada.value.trim();
  if (!v) return;
  entrada.value = '';
  msg(v,'minha');
  limpaRapidas();
  processar(v);
  acaoCliente();
};
entrada.addEventListener('keydown', e => { if (e.key === 'Enter') enviar.click(); });
document.getElementById('reiniciar').onclick = iniciar;

iniciar();
</script>
