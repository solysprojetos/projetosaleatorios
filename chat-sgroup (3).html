<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Sgroup Proteção Veicular</title>
<style>
  :root{
    --topo:#075e54;
    --topo2:#0b6b5f;
    --acao:#25d366;
    --fundo:#e5ddd5;
    --bot:#ffffff;
    --meu:#d9fdd3;
    --texto:#111b21;
    --suave:#667781;
    --link:#027eb5;
    --tick:#53bdeb;
    --ouro:#c9a24b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:#0b141a;color:var(--texto);
    font-family:"Segoe UI",ui-sans-serif,system-ui,"Helvetica Neue",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .tela{
    width:390px;height:min(844px, calc(100dvh - 40px));
    display:flex;flex-direction:column;background:var(--fundo);
    border-radius:38px;overflow:hidden;position:relative;
    border:10px solid #0d1418;box-shadow:0 24px 60px rgba(0,0,0,.5);
  }
  .entalhe{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:130px;height:24px;background:#0d1418;border-radius:0 0 16px 16px;z-index:4;
  }
  .statusbar{
    background:var(--topo);color:#fff;display:flex;justify-content:space-between;align-items:center;
    padding:7px 22px 2px;font-size:12px;font-weight:600;flex:none;letter-spacing:.2px;
  }
  @media (max-width:520px){
    body{padding:0;background:var(--fundo)}
    .tela{width:100%;height:100dvh;border:none;border-radius:0;box-shadow:none}
    .entalhe{display:none}
  }

  .topo{
    background:var(--topo);color:#fff;display:flex;align-items:center;gap:11px;
    padding:8px 12px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.15);z-index:3;
  }
  .topo .voltar{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:2px 2px 2px 0;line-height:1;opacity:.9}
  .avatar{
    width:40px;height:40px;border-radius:50%;flex:none;object-fit:cover;
    background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.35);
  }
  .topo .quem{min-width:0;display:flex;flex-direction:column;justify-content:center}
  .topo h1{font-size:16px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topo .sub{font-size:12.5px;opacity:.85;min-height:15px;transition:opacity .2s}
  .topo .icons{margin-left:auto;display:flex;gap:16px;font-size:18px;opacity:.9}
  .topo .icons span{cursor:pointer}

  .selo{
    background:#fff8e8;color:#7a5a12;border-bottom:1px solid #f0e2bf;
    font-size:11px;text-align:center;padding:5px 10px;flex:none;
  }
  .selo b{color:var(--ouro)}

  .conversa{
    flex:1;overflow-y:auto;padding:14px 12px 18px;display:flex;flex-direction:column;gap:7px;
    background-color:var(--fundo);
    background-image:radial-gradient(circle at 20% 30%, rgba(255,255,255,.35) 0 2px, transparent 3px),
                     radial-gradient(circle at 70% 60%, rgba(255,255,255,.3) 0 2px, transparent 3px);
    background-size:70px 70px;scroll-behavior:smooth;
  }
  .dia{align-self:center;background:#e1f2fb;color:#54808f;font-size:12px;padding:5px 12px;border-radius:8px;margin:2px 0;box-shadow:0 1px .5px rgba(11,20,26,.1)}
  .aviso{align-self:center;max-width:88%;text-align:center;background:#ffeecf;color:#7a5a12;font-size:11.5px;padding:6px 12px;border-radius:8px;line-height:1.4;box-shadow:0 1px .5px rgba(11,20,26,.1)}

  .msg{
    max-width:82%;padding:6px 9px 5px;font-size:14.5px;line-height:1.42;position:relative;
    border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13);white-space:pre-wrap;word-wrap:break-word;
    animation:pop .18s ease-out;
  }
  @keyframes pop{from{transform:translateY(6px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .msg b{font-weight:600}
  .msg .hora{font-size:10.5px;color:var(--suave);float:right;margin:6px 0 -2px 10px;user-select:none}
  .deles{background:var(--bot);align-self:flex-start;border-top-left-radius:0}
  .minha{background:var(--meu);align-self:flex-end;border-top-right-radius:0}
  .minha .hora .tk{color:var(--suave);margin-left:3px;transition:color .3s}
  .minha .hora .tk.lida{color:var(--tick)}

  .cartao{
    max-width:82%;align-self:flex-start;background:var(--bot);border-radius:8px;border-top-left-radius:0;
    box-shadow:0 1px .5px rgba(11,20,26,.13);overflow:hidden;animation:pop .18s ease-out;
  }
  .cartao .marca{display:flex;justify-content:center;padding:14px 10px 6px;background:linear-gradient(180deg,#fbfcfc,#fff)}
  .cartao .marca img{width:132px;height:auto}
  .cartao p{margin:0;padding:8px 12px 4px;font-size:14.5px;line-height:1.45}
  .cartao .hora{display:block;text-align:right;font-size:10.5px;color:var(--suave);padding:0 10px 6px}
  .cartao button{
    width:100%;border:none;border-top:1px solid #e9edef;background:var(--bot);color:var(--link);
    padding:11px;font-size:14.5px;font-family:inherit;cursor:pointer;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .cartao button:hover{background:#f5f6f6}
  .cartao button[disabled]{color:var(--suave);cursor:default;background:#f7f8f8}

  .digitando{background:var(--bot);align-self:flex-start;border-radius:8px;border-top-left-radius:0;padding:11px 14px;box-shadow:0 1px .5px rgba(11,20,26,.13)}
  .digitando span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:#9aa3a8;animation:p 1s infinite}
  .digitando span:nth-child(2){animation-delay:.15s}
  .digitando span:nth-child(3){animation-delay:.3s}
  @keyframes p{0%,60%,100%{opacity:.3}30%{opacity:1}}

  .rapidas{display:flex;flex-wrap:wrap;gap:6px;padding:2px 12px 6px;justify-content:flex-end}
  .rapidas button{
    background:#fff;color:var(--link);border:1px solid #cfd6d8;border-radius:16px;
    padding:7px 14px;font-size:14px;font-family:inherit;cursor:pointer;transition:background .12s,transform .05s;
  }
  .rapidas button:hover{background:#f0f7fb}
  .rapidas button:active{transform:scale(.97)}

  .barra{display:flex;gap:8px;align-items:center;padding:7px 8px;background:#f0f2f5;flex:none}
  .barra input{
    flex:1;border:none;border-radius:20px;padding:11px 16px;font-size:15px;font-family:inherit;
    background:#fff;color:var(--texto);box-shadow:0 1px 1px rgba(0,0,0,.05);
  }
  .barra input:focus,button:focus-visible{outline:2px solid var(--topo);outline-offset:1px}
  .barra .enviar{
    width:44px;height:44px;border:none;border-radius:50%;background:var(--acao);color:#fff;
    font-size:17px;cursor:pointer;flex:none;display:grid;place-items:center;transition:transform .05s,background .12s;
  }
  .barra .enviar:hover{background:#1fb457}
  .barra .enviar:active{transform:scale(.94)}
  .barra .enviar[disabled]{opacity:.45;cursor:not-allowed}
  .recomeca{background:none;border:none;color:var(--suave);font-size:20px;cursor:pointer;padding:6px}

  .fundo{position:fixed;inset:0;background:rgba(11,20,26,.5);display:none;z-index:5}
  .fundo.on{display:block}
  .folha{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(340px,calc(100% - 28px));max-height:78vh;background:#fff;border-radius:14px;
    display:none;flex-direction:column;overflow:hidden;z-index:6;box-shadow:0 18px 50px rgba(0,0,0,.4);
  }
  .folha.on{display:flex;animation:pop .16s ease-out}
  .folha .cabeca{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid #eef0f1}
  .folha h2{font-size:17px;margin:0;font-weight:500}
  .fechar{background:none;border:none;font-size:22px;line-height:1;padding:2px 6px;cursor:pointer;color:var(--texto)}
  .lista{overflow-y:auto;padding-bottom:8px}
  .item{
    width:100%;display:flex;align-items:center;gap:13px;background:none;
    border:none;text-align:left;padding:14px 18px;font-size:15px;font-family:inherit;color:var(--texto);cursor:pointer;
  }
  .item:hover{background:#f5f6f6}
  .item .ic{width:34px;height:34px;border-radius:50%;background:#eafaf0;color:var(--topo);display:grid;place-items:center;font-size:16px;flex:none}
  .item .txt{flex:1;line-height:1.25}
  .item .txt small{display:block;color:var(--suave);font-size:12px;margin-top:1px}
  @media (prefers-reduced-motion:reduce){.digitando span{animation:none;opacity:.5}.msg,.cartao,.folha.on{animation:none}}
</style>
</head>

const hora = () => new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const fim  = () => conversa.scrollTop = conversa.scrollHeight;

function setStatus(t){ statusTopo.textContent = t; }

function msg(texto, quem='deles'){
  const el = document.createElement('div');
  el.className = 'msg ' + quem;
  el.innerHTML = texto;
  const h = document.createElement('span');
  h.className = 'hora';
  h.textContent = hora();
  if (quem === 'minha'){
    const tk = document.createElement('span');
    tk.className = 'tk';
    tk.textContent = '✓✓';
    h.appendChild(tk);
    lidasPend.push(tk);
  }
  el.appendChild(h);
  conversa.appendChild(el);
  fim();
}

function marcarLidas(){ lidasPend.forEach(tk => tk.classList.add('lida')); lidasPend = []; }

function bot(texto, depois){
  setStatus('digitando…');
  const t = document.createElement('div');
  t.className = 'digitando';
  t.innerHTML = '<span></span><span></span><span></span>';
  conversa.appendChild(t); fim();
  const espera = Math.min(1200, 500 + texto.replace(/<[^>]+>/g,'').length * 12);
  setTimeout(() => {
    t.remove(); marcarLidas(); setStatus('online');
    msg(texto,'deles');
    if (depois) depois();
  }, espera);
}

function aviso(t){
  const el = document.createElement('div');
  el.className = 'aviso'; el.innerHTML = t;
  conversa.appendChild(el); fim();
}

function rapidasBotoes(l){
  rapidas.innerHTML = '';
  l.forEach(([rotulo,valor]) => {
    const b = document.createElement('button');
    b.textContent = rotulo;
    b.onclick = () => { msg(rotulo,'minha'); rapidas.innerHTML=''; processar(valor); };
    rapidas.appendChild(b);
  });
}
const limpaRapidas = () => rapidas.innerHTML = '';
const soDigitos = s => s.replace(/\D/g,'');
const formatar = d => d.length === 11
  ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4')
  : d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5');

  marca.appendChild(img);
  const p = document.createElement('p');
  p.innerHTML = 'Bem-vindo(a) à <b>Sgroup Proteção Veicular</b>! \u{1F981}<br><br>Sou o assistente virtual. \u{1F4CC} Como podemos ajudar você hoje?';
  const h = document.createElement('span');
  h.className = 'hora'; h.textContent = hora();
  const b = document.createElement('button');
  b.innerHTML = '☰&nbsp; Selecione uma opção';
  b.onclick = () => abrirLista(b);
  card.append(marca,p,h,b);
  conversa.appendChild(card); fim();
}

function abrirLista(botao){
  botaoAtual = botao || null;
  lista.innerHTML = '';
  MENU.forEach(({op,ic,desc}) => {
    const b = document.createElement('button');
    b.className = 'item';
    b.innerHTML = '<span class="ic">'+ic+'</span><span class="txt">'+op+'<small>'+desc+'</small></span>';
    b.onclick = () => { fecharLista(); escolher(op); };
    lista.appendChild(b);
  });
  fundo.classList.add('on');
  folha.classList.add('on');
}
function fecharLista(){ fundo.classList.remove('on'); folha.classList.remove('on'); }
document.getElementById('fecharFolha').onclick = fecharLista;
fundo.onclick = fecharLista;
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharLista(); });

function escolher(op){
  if (botaoAtual){ botaoAtual.innerHTML = '☰&nbsp; ' + op; botaoAtual.disabled = true; botaoAtual = null; }
  msg(op,'minha');
  servico = op;
  limpaRapidas();

  switch(op){
    case 'Segunda via de Boletos':
      estado = 'cpf'; tentativas = 0;
      bot('Para reenviarmos seu(s) boleto(s), digite o número do seu <b>CPF ou CNPJ</b> (somente números):');
      break;
    case 'Informar roubo/furto':
      estado = 'placa';
      bot('Sentimos muito pelo ocorrido. \u{1F64F} Vamos abrir seu registro com prioridade.', () =>
      bot('Por favor, informe a <b>placa</b> do veículo (ex.: ABC1D23):'));
      break;
    case 'Assistência 24h':
      estado = 'confirmar';
      bot('Assistência 24h acionada. \u{1F527} Temos guincho, pane seca, chaveiro e troca de pneu.', () =>
      bot('Deseja que eu <b>acione um atendente</b> agora para enviar o socorro?', () =>
      rapidasBotoes([['Sim, preciso de socorro','sim'],['Só tirar dúvida','duvida'],['Voltar ao menu','voltar']])));
      break;
    case 'Faça sua cotação':
      estado = 'cotacao';
      bot('Que ótimo! \u{1F4CB} Faça sua cotação em segundos.', () =>
      bot('Informe o <b>modelo e ano</b> do veículo (ex.: Onix 2021):'));
      break;
    case 'Consultar Sinistro':
      estado = 'sinistro';
      bot('Vamos consultar seu sinistro. \u{1F50D} Informe o <b>número do protocolo</b> (ex.: 2025-123456):');
      break;
    case 'Rastreamento':
      estado = 'cpf'; tentativas = 0; servico = 'Rastreamento';
      bot('Para verificar o <b>rastreador</b> do seu veículo, confirme seu <b>CPF ou CNPJ</b> (somente números):');
      break;
    default: // Atendimento ao Associado
      estado = 'confirmar';
      bot('Certo! Vou te encaminhar ao <b>Atendimento ao Associado</b>.', () =>
      bot('Deseja falar com um atendente agora?', () =>
      rapidasBotoes([['Sim','sim'],['Não','nao'],['Voltar ao menu','voltar']])));
  }
}

function iniciar(){
  conversa.innerHTML = '';
  limpaRapidas();
  estado = 'saudacao'; tentativas = 0; servico = null; lidasPend = [];
  entrada.disabled = false; enviar.disabled = false;
  setStatus('online');
  const d = document.createElement('div');
  d.className = 'dia'; d.textContent = 'HOJE';
  conversa.appendChild(d);
  aviso('\u{1F512} As mensagens são protegidas. Esta é uma simulação com dados fictícios.');
  bot('Olá! \u{1F44B} Você está no atendimento da <b>Sgroup Proteção Veicular</b>. Envie qualquer mensagem para começarmos.');
}

function finalizarBoas(nome){
  bot('Precisa de mais alguma coisa'+(nome?', '+nome:'')+'?', () =>
    rapidasBotoes([['Falar com atendente','sim'],['Não, obrigado','nao'],['Voltar ao menu','voltar']]));
}

function processar(texto){
  if (texto === '__menu__'){ estado='menu'; abrirLista(null); return; }

  if (estado === 'saudacao'){
    estado = 'menu';
    setStatus('digitando…');
    const t = document.createElement('div');
    t.className = 'digitando';
    t.innerHTML = '<span></span><span></span><span></span>';
    conversa.appendChild(t); fim();
    setTimeout(() => { t.remove(); marcarLidas(); setStatus('online'); cartaoMenu(); }, 700);
    return;
  }

  if (estado === 'menu'){
    const achou = MENU.find(o => o.op.toLowerCase() === texto.toLowerCase());
    if (achou) return escolher(achou.op);
    bot('Toque em <b>"Selecione uma opção"</b> para escolher um dos serviços.', menuRapidas);
    return;
  }

  if (estado === 'cpf'){
    const doc = soDigitos(texto);
    if (doc.length !== 11 && doc.length !== 14){
      bot('Documento inválido. ⚠️ Digite o <b>CPF (11 dígitos)</b> ou o <b>CNPJ (14 dígitos)</b>.');
      return;
    }
    if (BASE[doc]){
      const c = BASE[doc];
      estado = 'confirmar';
      if (servico === 'Rastreamento'){
        bot('Cadastro localizado: <b>'+c.nome+'</b> ✅', () =>
        bot('\u{1F4E1} Rastreador do veículo <b>'+c.placa+'</b>: <b>ATIVO</b>.\nÚltima posição há 3 min — Av. Brasil, Rio de Janeiro/RJ.\nBateria: 92% · Sinal: forte.', () =>
        finalizarBoas(c.nome)));
      } else {
        bot('Encontrei seu cadastro, <b>'+c.nome+'</b> ✅', () =>
        bot('\u{1F9FE} Enviei o boleto em aberto do documento <b>'+formatar(doc)+'</b> (plano '+c.plano+') para o e-mail cadastrado.\nVencimento: dia 10. Também posso reenviar por SMS.', () =>
        finalizarBoas(c.nome)));
      }
      return;
    }
    tentativas++;
    if (tentativas === 1){
      bot('Não localizamos esse documento. \u{1F914} Pode conferir e digitar novamente?');
    } else {
      estado = 'confirmar';
      bot('Ainda não localizei seu cadastro. Deseja falar com um atendente?', () =>
        rapidasBotoes([['Sim','sim'],['Não','nao'],['Voltar ao menu','voltar']]));
    }
    return;
  }

  if (estado === 'placa'){
    const p = texto.toUpperCase().replace(/[^A-Z0-9]/g,'');
    if (p.length < 6 || p.length > 7){
      bot('Placa inválida. ⚠️ Digite no formato <b>ABC1D23</b> ou <b>ABC1234</b>.');
      return;
    }
    estado = 'confirmar';
    const pr = protocolo();
    bot('Registro aberto para a placa <b>'+p+'</b>. \u{1F6A8}', () =>
    bot('\u{1F4CC} Protocolo: <b>'+pr+'</b>\nOriente-se: registre o Boletim de Ocorrência (B.O.) e mantenha este número.', () =>
    bot('Vou te conectar a um atendente da <b>central de sinistros</b> agora. Confirma?', () =>
    rapidasBotoes([['Sim, falar agora','sim'],['Depois','nao'],['Voltar ao menu','voltar']]))));
    return;
  }

  if (estado === 'cotacao'){
    estado = 'confirmar';
    const v = texto.trim();
    const base = 89 + Math.floor(Math.random()*70);
    bot('Perfeito! Simulei uma proteção para <b>'+v+'</b>. \u{1F4CB}', () =>
    bot('\u{1F4B0} Plano Prata a partir de <b>R$ '+base+',90/mês</b>\n\u{1F91D} Sem consulta ao SPC/Serasa · sem análise de perfil.\nInclui rastreamento, assistência 24h e cobertura nacional.', () =>
    bot('Quer que um consultor finalize sua adesão?', () =>
    rapidasBotoes([['Sim, quero contratar','sim'],['Receber por e-mail','nao'],['Voltar ao menu','voltar']]))));
    return;
  }

  if (estado === 'sinistro'){
    const pr = soDigitos(texto);
    if (pr.length < 6){
      bot('Protocolo inválido. ⚠️ Informe o número no formato <b>2025-123456</b>.');
      return;
    }
    estado = 'confirmar';
    bot('Localizei o sinistro <b>'+texto.trim()+'</b>. \u{1F50D}', () =>
    bot('\u{1F4C4} Status: <b>Em análise de documentação</b>\nAbertura: há 5 dias · Regulador: em atendimento.\nPrevisão de retorno: até 2 dias úteis.', () =>
    finalizarBoas(null)));
    return;
  }

  if (estado === 'confirmar'){
    const r = texto.toLowerCase().trim();
    if (r === 'duvida'){ estado='menu'; bot('Sem problemas! Qual a sua dúvida? Você também pode voltar ao menu.', menuRapidas); return; }
    if (r.startsWith('s')) return transbordo();
    if (r.startsWith('v')) return iniciar();
    if (r.startsWith('n')) return encerrar();
    bot('Não entendi. \u{1F642} Responda com <b>sim</b>, <b>não</b> ou <b>voltar</b>.', () =>
      rapidasBotoes([['Sim','sim'],['Não','nao'],['Voltar ao menu','voltar']]));
    return;
  }

  if (estado === 'encerrado'){
    estado = 'saudacao';
    processar(texto);
  }
}

function transbordo(){
  estado = 'encerrado';
  const fila = 1 + Math.floor(Math.random()*3);
  bot('Certo! \u{1F464} Estou te transferindo para um de nossos atendentes.', () =>
  bot('Você é o <b>'+fila+'º</b> da fila — tempo médio de espera: '+(fila*2)+' min. Assim que um atendente assumir, você será avisado por aqui. \u{1F514}', limpaRapidas));
}

function encerrar(){
  estado = 'encerrado';
  bot('Agradecemos o contato com a <b>Sgroup Proteção Veicular</b>. \u{1F981}\nEstamos à disposição sempre que precisar. \u{1F91D}', () =>
    rapidasBotoes([['Iniciar novo atendimento','voltar']]));
}

enviar.onclick = () => {
  const v = entrada.value.trim();
  if (!v) return;
  entrada.value = '';
  msg(v,'minha');
  limpaRapidas();
  processar(v);
};
entrada.addEventListener('keydown', e => { if (e.key === 'Enter') enviar.click(); });
document.getElementById('reiniciar').onclick = iniciar;
document.querySelector('.topo .voltar').onclick = iniciar;

iniciar();
</script>
</body>
</html>
